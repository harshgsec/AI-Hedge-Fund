<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Hedge Fund Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#090d14; --card:#121826; --border:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --green:#22c55e; --red:#ef4444; --blue:#3b82f6; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:Inter,system-ui,sans-serif; background:var(--bg); color:var(--text); }
.topbar { display:flex; align-items:center; justify-content:space-between; padding:1rem 1.5rem; border-bottom:1px solid var(--border); background:#0c1220; }
.brand { font-weight:700; font-size:1.25rem; }
.controls { display:flex; gap:1rem; align-items:center; }
.controls select, .controls input { background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:0.4rem 0.6rem; }
.btn { background:var(--blue); color:white; border:none; border-radius:6px; padding:0.5rem 1rem; cursor:pointer; font-weight:600; }
.btn.stop { background:#475569; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1rem; padding:1.5rem; }
.card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:1.2rem; }
.card h3 { font-size:0.75rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:0.4rem; }
.metric { font-size:1.6rem; font-weight:700; }
.signal { font-size:2.5rem; font-weight:800; text-align:center; padding:1rem; border-radius:10px; }
.signal.BUY { background:#14532d; color:#86efac; }
.signal.SELL { background:#7f1d1d; color:#fca5a5; }
.signal.HOLD { background:#1e293b; color:#cbd5e1; }
table { width:100%; border-collapse:collapse; font-size:0.85rem; }
th,td { padding:0.5rem; text-align:left; border-bottom:1px solid var(--border); }
.section { padding:0 1.5rem 1.5rem; }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">AI Hedge Fund Terminal</div>
  <div class="controls">
    <select id="broker">
      <option value="kite">Kite</option>
      <option value="fyers">FYERS</option>
      <option value="delta">Delta Live</option>
      <option value="delta_demo">Delta Demo</option>
    </select>
    <select id="interval"><option value="30">30s</option><option value="60">1m</option><option value="300">5m</option></select>
    <input id="risk" type="number" value="1.0" step="0.1" min="0.1" max="5" style="width:70px">
    <button class="btn" id="toggle">Start</button>
  </div>
</div>
<div class="grid">
  <div class="card"><h3>Broker</h3><div class="metric" id="brokerName" style="font-size:1.1rem">—</div></div>
  <div class="card"><h3>Equity</h3><div class="metric" id="equity">—</div></div>
  <div class="card"><h3>Confidence</h3><div class="metric" id="confidence">0</div></div>
  <div class="card"><h3>Fills</h3><div class="metric" id="fills">0</div></div>
</div>
<div class="section"><div class="card"><div class="signal HOLD" id="signal">HOLD</div><div id="logic" style="margin-top:0.5rem;color:var(--muted)"></div></div></div>
<div class="section"><h2>Open Positions</h2><div class="card"><table id="positions"><thead><tr><th>Symbol</th><th>Side</th><th>Volume</th><th>P/L</th></tr></thead><tbody></tbody></table></div></div>
<div class="section"><h2>Fills</h2><div class="card"><table id="history"><thead><tr><th>Time</th><th>Symbol</th><th>Side</th><th>Fill</th><th>Status</th></tr></thead><tbody></tbody></table></div></div>
<script>
const $ = id => document.getElementById(id);
let running = false;
async function refresh() {
  try {
    const r = await fetch('/api/status');
    const s = await r.json();
    $('brokerName').textContent = (s.broker || '—').replace('_',' ').toUpperCase();
    $('equity').textContent = s.equity ? s.equity.toFixed(2) : '—';
    $('confidence').textContent = s.last_confidence || 0;
    $('fills').textContent = (s.trade_history || []).length;
    const sig = $('signal');
    sig.textContent = s.last_signal || 'HOLD';
    sig.className = 'signal ' + (s.last_signal || 'HOLD');
    $('logic').textContent = s.last_logic || '';
    const pt = $('positions').querySelector('tbody');
    pt.innerHTML = (s.open_positions || []).map(p => `<tr><td>${p.symbol}</td><td>${p.type}</td><td>${p.volume}</td><td>${p.profit}</td></tr>`).join('');
    const ht = $('history').querySelector('tbody');
    ht.innerHTML = (s.trade_history || []).slice(-20).reverse().map(h => `<tr><td>${h.time}</td><td>${h.symbol}</td><td>${h.signal}</td><td>${h.fill}</td><td>${h.status}</td></tr>`).join('');
    if (s.broker) $('broker').value = s.broker;
  } catch(e) {}
}
$('toggle').onclick = async () => {
  running = !running;
  $('toggle').textContent = running ? 'Stop' : 'Start';
  $('toggle').className = running ? 'btn stop' : 'btn';
  await fetch('/api/control', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action: running?'start':'stop', interval:parseInt($('interval').value), risk_percent:parseFloat($('risk').value)})});
  refresh();
};
setInterval(refresh, 3000);
refresh();
</script>
</body>
</html>
